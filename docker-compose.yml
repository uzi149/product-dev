# Sentinel infrastructure. The Python services and the frontend run natively (see README).
# All ports are published on BIND_ADDRESS (default 127.0.0.1 = this machine only).

# Simulated camera (profile `sim`), used by sim-cam-01 and sim-cam-02 below. The video is
# re-encoded with a keyframe every second, as cameras send it, so the 5 s fragments of live
# ingestion really are 5 s. The image is MediaMTX's own, with FFmpeg (same version as the server).
x-sim-camera: &sim-camera
  image: bluenviron/mediamtx:1.11.3-ffmpeg
  profiles: [sim]
  depends_on: [mediamtx]
  restart: unless-stopped
  entrypoint:
    - sh
    - -c
    - >-
      exec ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /video -an
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -force_key_frames 'expr:gte(t,n_forced*1)'
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/$$CAMERA_PATH
  mem_limit: 256m

name: sentinel

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  minio:
    # The official minio/minio images are no longer published; see docs/ADRs/0005.
    image: bitnamilegacy/minio:2025.7.23
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sentinel}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sentinel_dev_password}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # One-shot: creates the bucket, then exits with code 0.
  minio-init:
    image: bitnamilegacy/minio:2025.7.23
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sentinel}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-sentinel_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinel}
    volumes:
      - ./infrastructure/minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  # The image has no shell, so there is no container healthcheck; tests check the port.
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_RTSP_PORT:-8554}:8554"
    volumes:
      - ./infrastructure/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    mem_limit: 256m

  # Simulated cameras (profile `sim`): FFmpeg loops a video into MediaMTX as a live RTSP stream,
  # read by live ingestion at rtsp://127.0.0.1:8554/cam-01 and cam-02. Make the default clips with
  # `python -m tests.ingestion.videos test-data/sim`, or point SIM_CAM01_VIDEO / SIM_CAM02_VIDEO at
  # any video. `docker compose stop sim-cam-01` interrupts one camera, `start` brings it back.
  sim-cam-01:
    <<: *sim-camera
    environment:
      CAMERA_PATH: cam-01
    volumes:
      - type: bind
        source: ${SIM_CAM01_VIDEO:-./test-data/sim/cam-01.mp4}
        target: /video
        read_only: true
        bind:
          # A missing video is an error, not an empty folder created in its place.
          create_host_path: false

  sim-cam-02:
    <<: *sim-camera
    environment:
      CAMERA_PATH: cam-02
    volumes:
      - type: bind
        source: ${SIM_CAM02_VIDEO:-./test-data/sim/cam-02.mp4}
        target: /video
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
  minio_data:
  redis_data:
