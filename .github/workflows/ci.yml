name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_dev_password
          POSTGRES_DB: sentinel
        # 5433 matches the default in shared/config.py
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Enable pgvector in the service database
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=sentinel_dev_password psql -h 127.0.0.1 -p 5433 -U sentinel -d sentinel \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
      # MinIO, Redis and MediaMTX are not started here: their smoke tests skip themselves.
      - name: Test
        run: pytest -m "not models"
