[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.0.1"
description = "Local VLM camera intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    # Database: PostgreSQL + pgvector
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Storage and queue
    "minio>=7.2",
    "redis>=5.0",
    # Video
    "opencv-python>=4.10",
    "numpy>=1.26",
    # HTTP client for the OpenAI-compatible VLM server (vLLM); also used by FastAPI's TestClient
    "httpx>=0.27",
]

[project.optional-dependencies]
# In-process Qwen-VL for laptop development (scope §4 "Development VLM").
vlm = [
    "torch>=2.4",
    "transformers>=4.49",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose services running",
    "models: loads AI models or calls a hosted API (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
