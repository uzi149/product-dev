[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.0.1"
description = "Local VLM camera intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    # Database: PostgreSQL + pgvector
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Storage and queue
    "minio>=7.2",
    "redis>=5.0",
    # Background jobs (ADR 0011)
    "celery[redis]>=5.4",
    # Encrypts camera source URIs
    "cryptography>=43",
    # Video
    "opencv-python>=4.10",
    "numpy>=1.26",
    # HTTP client for the OpenAI-compatible VLM API (OpenRouter, or vLLM on the pilot); also used by FastAPI's TestClient
    "httpx>=0.27",
    # Local models: the embedding models, which always run locally (ADR 0020), and the
    # in-process Qwen-VL fallback when no VLM key is set (ADR 0019). On Linux, install the CPU
    # build of torch (see the README) unless the machine has a GPU.
    "torch>=2.4",
    # Transformers 5 loads Qwen-VL's video processor with the image one; it needs torchvision.
    "torchvision>=0.19",
    "transformers>=4.56",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Ground-truth files of the acceptance tests (already installed with uvicorn[standard]).
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose services running",
    "models: loads AI models or calls a hosted API (skipped in CI)",
    "live: streams through the MediaMTX RTSP server for a minute or more",
    "acceptance: phase acceptance tests on known videos (run by hand, with the models)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations in argument defaults are the intended usage.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
